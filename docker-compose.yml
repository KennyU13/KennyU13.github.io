services:
  portfolio-dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - portfolio_node_modules:/app/node_modules

  portfolio:
    build:
      context: .
    ports:
      - "8080:80"

volumes:
  portfolio_node_modules:
